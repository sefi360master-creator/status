# Configuracao do Upptime — status.sefi360.com.br
# Nada aqui e segredo: o repositorio e publico..

owner: sefi360master-creator
repo: status
user-agent: sefi360-status

# Lista fechada de segredos que o Upptime pode usar.
secrets:
  - N8N_URL
  - NOTIFICATION_TELEGRAM
  - NOTIFICATION_TELEGRAM_BOT_KEY
  - NOTIFICATION_TELEGRAM_CHAT_ID

sites:
  - name: Aplicativo SEFi360
    url: https://sefi360.com.br/
    maxResponseTime: 5000
    __dangerous__body_down: "Service temporarily unavailable"

  - name: Aplicativo - dados
    url: https://sefi360.com.br/api/1.1/obj/cenarios_template?limit=1
    maxResponseTime: 5000
    __dangerous__body_down_if_text_missing: '"results"'

  - name: Ambiente de testes
    url: https://sefi360.com.br/version-test/
    maxResponseTime: 8000
    __dangerous__body_down: "Service temporarily unavailable"

  - name: Motores de calculo
    url: $N8N_URL
    maxResponseTime: 5000
    expectedStatusCodes:
      - 200
      - 401

  - name: Pagina de acesso
    url: https://acesso.sefi360.com.br/
    maxResponseTime: 5000

  - name: Noticias
    url: https://noticias.sefi360.com.br/
    maxResponseTime: 5000

status-website:
  cname: status.sefi360.com.br
  name: SEFi360 Status
  introTitle: "Status dos servicos SEFi360"
  introMessage: Disponibilidade e tempo de resposta, medidos a cada 5 minutos.
  navbar:
    - title: Status
      href: /
    - title: SEFi360
      href: https://sefi360.com.br
